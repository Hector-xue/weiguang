name: 验证 App

on:
  push:
    branches: [main]
    paths: ['probe/**', '.github/workflows/probe.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: probe
    env:
      PROBE_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: 编译
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: 改名
        run: cp app/build/outputs/apk/release/app-release.apk weiguang-probe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: weiguang-probe
          path: probe/weiguang-probe.apk
          retention-days: 7
      # 非 v* 的 Release 一律标预发布，免得以后抢正式版的 Latest
      - name: 发到 Release（probe）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete probe --cleanup-tag -y || true
          gh release create probe weiguang-probe.apk --prerelease --target "$GITHUB_SHA" \
            --title "验证 App 0.1.${PROBE_BUILD}" --notes "伴听模式可行性验证工具，不是正式 App。"
      - name: 更新下载站
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml -R "$GITHUB_REPOSITORY" --ref main
